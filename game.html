<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Jeu de Go</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="container mt-4">

    <h1 class="text-center">Jeu de Go</h1>

    <div class="text-center mb-3">
        <label for="boardSize">Plateau :</label>
        <select id="boardSize" class="form-select w-auto d-inline">
            <option value="9">9x9</option>
            <option value="13">13x13</option>
            <option value="19">19x19</option>
        </select>
    </div>

    <div class="text-center mb-3">
        <label for="gameMode">Mode :</label>
        <select id="gameMode" class="form-select w-auto d-inline">
            <option value="pvp">Joueur vs Joueur</option>
            <option value="pve">Joueur vs Ordinateur</option>
        </select>
    </div>

    <div class="text-center mb-3">
        <label for="difficulty">Difficulté IA :</label>
        <select id="difficulty" class="form-select w-auto d-inline">
            <option value="easy">Facile</option>
            <option value="medium">Moyen</option>
            <option value="hard">Difficile</option>
        </select>
    </div>

    <div class="text-center mb-3">
        <button id="newGame" class="btn btn-primary">Nouvelle partie</button>
        <button id="pass" class="btn btn-secondary">Passer</button>
    </div>

    <div class="row">
        <div class="col-md-8 text-center">
            <div id="board"></div>
        </div>

        <div class="col-md-4">
            <h4>Informations</h4>
            <p>Joueur actuel : <span id="player">Noir</span></p>
            <p>Prisonniers Noir : <span id="blackPrisoners">0</span></p>
            <p>Prisonniers Blanc : <span id="whitePrisoners">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
